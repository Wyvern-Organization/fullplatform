[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos"
version = "1.0.0"
description = "Consumer-facing control and recovery plane for MythOS"
requires-python = ">=3.11"

[project.scripts]
mythos = "mythos.gui:main"
mythos-drivers = "mythos.gui:drivers_main"
mythos-recovery = "mythos.gui:recovery_main"
mythosctl = "mythos.cli:main"
mythos-welcome = "mythos.welcome:main"
mythos-migrate = "mythos.migrate_gui:main"
mythos-open = "mythos.open_app:main"
mythos-privileged = "mythos.privileged_client:main"
mythos-privileged-service = "mythos.privileged_service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mythos"]
