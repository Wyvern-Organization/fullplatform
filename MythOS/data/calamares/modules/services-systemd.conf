---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "gdm.service"
    action: "enable"
    mandatory: true
  - name: "cups.socket"
    action: "enable"
  - name: "bluetooth.service"
    action: "enable"
  - name: "fwupd.service"
    action: "enable"
  - name: "ufw.service"
    action: "enable"
  - name: "apparmor.service"
    action: "enable"
  - name: "mythos-initialize.service"
    action: "enable"
    mandatory: true
  - name: "mythos-boot-health.service"
    action: "enable"
    mandatory: true
  - name: "snapper-cleanup.timer"
    action: "enable"
  - name: "snapper-timeline.timer"
    action: "enable"
  - name: "ssh.service"
    action: "disable"

