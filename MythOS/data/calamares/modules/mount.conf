---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
  - device: /dev/pts
    mountPoint: /dev/pts
    options: [bind]

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /var/lib/mythos
    subvolume: /@state
btrfsSwapSubvol: /@swap

mountOptions:
  - filesystem: default
    options: [defaults, noatime]
  - filesystem: efi
    options: [defaults, umask=0077]
  - filesystem: btrfs
    options: [defaults, noatime, compress=zstd:1]
    ssdOptions: [discard=async]
    hddOptions: [autodefrag]
  - filesystem: btrfs_swap
    options: [defaults, noatime]

